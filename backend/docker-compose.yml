services:
  neo4j:
    image: neo4j:2026.09-community
    container_name: graphrag-neo4j
    ports:
      - "7474:7474" # Neo4j Browser: http://localhost:7474
      - "7687:7687" # Bolt (used by the backend)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc"]' # required by LangChain's Neo4jGraph
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
