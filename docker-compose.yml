services:

  # ── Neo4j graph + vector database ──────────────────────────────────────────
  neo4j:
    image: neo4j:2026.09-community
    container_name: graphrag-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser: http://localhost:7474
      - "7687:7687"   # Bolt (used by the backend)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_PLUGINS: '["apoc"]'   # required by LangChain's Neo4jGraph
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend     # Dockerfile is inside backend/
      dockerfile: Dockerfile
    container_name: graphrag-backend
    ports:
      - "8000:8000"   # Optional: exposes the API directly for debugging
    env_file:
      - ./backend/.env
    environment:
      # Inside Docker, services talk by service name, not localhost.
      NEO4J_URI: bolt://neo4j:7687
      # Allow requests from the nginx frontend container.
      CORS_ORIGINS: '["http://localhost"]'
    volumes:
      # Persist uploaded notes across container restarts.
      - uploads_data:/app/data/uploads
    depends_on:
      neo4j:
        condition: service_healthy

  # ── React frontend (nginx) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend    # Dockerfile is inside frontend/
      dockerfile: Dockerfile
    container_name: graphrag-frontend
    ports:
      - "80:80"       # App is available at http://localhost
    depends_on:
      - backend

volumes:
  neo4j_data:
  uploads_data:
