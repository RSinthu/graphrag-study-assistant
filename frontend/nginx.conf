server {
    listen 80;

    # Serve the built React app.
    root /usr/share/nginx/html;
    index index.html;

    # All /api/* calls are proxied to the FastAPI backend.
    # The trailing slash on proxy_pass strips the /api prefix,
    # matching what the Vite dev-server proxy does during development.
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # Allow large file uploads (PDF notes).
        client_max_body_size 50M;
    }

    # React Router: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
